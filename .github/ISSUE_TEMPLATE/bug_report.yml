name: Bug report
description: Report a reproducible problem in the app.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: app-version
    attributes:
      label: App version or commit
      placeholder: "For example, 0.1.0 or a short commit hash"
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Keep the steps small and repeatable.
      placeholder: "1. Open…\n2. Select…\n3. Click…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed usernames, absolute paths, simulator identifiers, cleanup logs, and other personal data from this report.
          required: true
